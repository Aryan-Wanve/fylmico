name: Deploy Hostinger Static Export

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  rebuild-and-publish:
    name: Rebuild and publish
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Hostinger static export
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build:hostinger

      - name: Commit and push updated static export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!node_modules'
          if git diff --cached --quiet; then
            echo "Static export unchanged; nothing to publish."
          else
            git commit -m "chore(deploy): rebuild Hostinger static export [skip deploy]"
            git push
          fi
